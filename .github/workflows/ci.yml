name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm vient du champ « packageManager » de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types (Svelte + TypeScript)
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Catalogue (schéma et cohérence)
        run: pnpm validate

      - name: Build
        run: pnpm build

      # Échoue si le JavaScript du premier chargement dépasse 200 Ko compressés.
      - name: Budget de poids
        run: pnpm budget
